name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Source self-test
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --self-test
      - name: Build Windows EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean TikTokAutoPublisher.spec
      - name: Frozen EXE self-test
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & ".\dist\TikTokAutoPublisher\TikTokAutoPublisher.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen self-test failed: $LASTEXITCODE" }
      - name: Verify x64 executable
        shell: powershell
        run: |
          $p = ".\dist\TikTokAutoPublisher\TikTokAutoPublisher.exe"
          $fs=[IO.File]::OpenRead($p); $br=New-Object IO.BinaryReader($fs)
          $fs.Position=0x3c; $off=$br.ReadInt32(); $fs.Position=$off+4; $machine=$br.ReadUInt16(); $fs.Dispose()
          if ($machine -ne 0x8664) { throw "Not AMD64 PE" }
      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build Setup.exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\TikTokAutoPublisher.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (!(Test-Path "release\TikTokAutoPublisher-Setup.exe")) { throw "Setup.exe missing" }
          Get-Item "release\TikTokAutoPublisher-Setup.exe" | Format-List Name,Length
          Get-FileHash "release\TikTokAutoPublisher-Setup.exe" -Algorithm SHA256
      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: TikTokAutoPublisher-Setup
          path: release/TikTokAutoPublisher-Setup.exe
          if-no-files-found: error
          retention-days: 30
